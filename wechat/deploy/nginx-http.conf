# Isolated host for ACME issuance; existing sites are not edited.
server {
    listen 80;
    listen [::]:80;
    server_name api.momoyu.ltd;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ip-please-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "IP PLEASE leaderboard deployment in progress\n";
    }
}
