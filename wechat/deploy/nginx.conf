server {
    listen 80;
    listen [::]:80;
    server_name api.momoyu.ltd;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ip-please-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://api.momoyu.ltd$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.momoyu.ltd;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ip-please-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-please-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IPPleaseTLS:2m;
    ssl_session_tickets off;

    access_log /var/log/nginx/ip-please-ranking.access.log;
    error_log /var/log/nginx/ip-please-ranking.error.log;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control no-store always;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
