<style>
  html, body { margin: 0; height: 100%; background: #161313; overflow: hidden; }
  body {
    box-sizing: border-box; font-family: system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #viewport { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  @media (pointer: fine) { canvas { cursor: none; } }
  .ui { position: fixed; top: max(6px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; z-index: 2; }
  html[data-native] #full { display: none; }
  .ui button {
    font: 12px system-ui, sans-serif; color: #968f87; background: rgba(22, 19, 19, 0.7);
    border: 1px solid #4a4440; border-radius: 3px; padding: 3px 8px; cursor: pointer;
  }
  .ui button:hover { color: #e4dfd4; }
  @media (max-height: 500px) { .ui { top: max(2px, env(safe-area-inset-top)); right: max(2px, env(safe-area-inset-right)); opacity: 0.55; } .ui button { font-size: 10px; padding: 1px 5px; } }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 3; background: rgba(22, 19, 19, 0.92);
    color: #e89c74; font-size: 16px; text-align: center; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; padding: 24px;
  }
  #rotate small { color: #968f87; font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: flex; } }
  noscript { color: #e4dfd4; }
</style>
</head>
<body>
<main id="viewport">
  <canvas id="game" width="640" height="360" aria-label="IP, PLEASE 游戏画面"></canvas>
</main>
<div class="ui">
  <button id="mute" type="button">声音：开</button>
  <button id="full" type="button">全屏</button>
</div>
<div id="rotate" class="show">
  <div>把手机横过来玩</div>
  <small>竖屏也能玩，但字会很小</small>
  <button type="button" onclick="this.parentNode.classList.remove('show')" style="margin-top:8px;padding:6px 14px">先竖着玩</button>
</div>
<noscript>这个游戏需要开启 JavaScript。</noscript>
<script src="assets.js"></script>
<script src="en.js"></script>
<script src="i18n.js"></script>
<script src="gfx.js"></script>
<script src="sfx.js"></script>
<script src="docs.js"></script>
<script src="data.js"></script>
<script src="booth.js"></script>
<script src="events.js"></script>
<script src="screens.js"></script>
<script src="main.js"></script>
<script>
  document.getElementById('mute').addEventListener('click', () => toggleMute());
  const fullBtn = document.getElementById('full');
  const root = document.documentElement;
  if (!root.requestFullscreen && !root.webkitRequestFullscreen) fullBtn.style.display = 'none';
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  });
</script>
</body>
